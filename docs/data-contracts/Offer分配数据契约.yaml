dataset_id: "offer_deterministic_ladder_v5"
owner_module: "gravity-sdk"
status: "planned"
contract_version: "v5"
timezone: "Asia/Shanghai"

readiness:
  physical_relations_ready: false
  verification_status: "pending_review"
  note: "The three offer relations are logical contracts and are not currently queryable physical relations."

relations:
  - name: "default.offer_tier_assignment"
    logical_key:
      - "offer_family"
      - "internal_user_id"
      - "decision_batch_id"
    required_fields:
      - "internal_user_id|BIGINT"
      - "offer_family|VARCHAR|bogo,cool,level,step"
      - "decision_batch_id|VARCHAR"
      - "previous_tier|BIGINT|null only for first state"
      - "assigned_tier|BIGINT"
      - "movement_action|VARCHAR|HOLD_INSTANCE,DEFAULT_CARD,RETURN_ONE,LOCK_ONE,UP_ONE,DOWN_ONE,HOLD"
      - "policy_version|VARCHAR"
      - "assigned_at|TIMESTAMP"
      - "effective_from|TIMESTAMP"
      - "effective_until|TIMESTAMP|null allowed"
      - "lock_next_opportunity|BIGINT|0,1"

  - name: "default.offer_tier_outcome"
    logical_key:
      - "offer_family"
      - "internal_user_id"
      - "opportunity_id"
    required_fields:
      - "internal_user_id|BIGINT"
      - "offer_family|VARCHAR|bogo,cool,level,step"
      - "opportunity_id|VARCHAR"
      - "decision_batch_id|VARCHAR"
      - "assigned_tier|BIGINT"
      - "opportunity_at|TIMESTAMP"
      - "outcome_closed_at|TIMESTAMP"
      - "opportunity_observed|BIGINT|0,1"
      - "purchased|BIGINT|0,1"
      - "purchase_steps|BIGINT|step uses 0..3; other families use 0..1"
      - "high_confidence_cancel|BIGINT|0,1"
      - "policy_version|VARCHAR"

  - name: "default.offer_unit_map"
    logical_key:
      - "offer_family"
      - "unit_id"
      - "tier"
      - "source_ref"
      - "pay_reason"
    required_fields:
      - "offer_family|VARCHAR|bogo,cool,level,step"
      - "unit_id|VARCHAR|campaign activity instance or level node unit"
      - "tier|BIGINT"
      - "source_ref|VARCHAR|activity_id or lv_id"
      - "pay_reason|VARCHAR"
      - "amount_cent|BIGINT"
      - "unit_start_at|TIMESTAMP"
      - "unit_end_at|TIMESTAMP"
      - "policy_version|VARCHAR"

privacy_boundary:
  - "relations stay in controlled GM/Gravity environments"
  - "no user-level rows or exports are committed to this repository"
