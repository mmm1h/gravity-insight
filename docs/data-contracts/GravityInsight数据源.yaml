system: "Gravity Web API"
owned_tool: "src/gravity_sdk"
architecture:
  - "operation-v2 contracts compile deterministically into 146 runtime operations and provenance"
  - "stable operation ids map to versioned upstream routes through a controlled registry"
  - "domain commands compose registered atomic reads and never construct arbitrary URLs"
  - "capability search and describe expose stable operations and non-callable drafts without treating discovery as support"
  - "read, export, file and future mutation effects use separate authorization policies"
  - "Insight and governed SQL share one process session, credential provider, connection pool and per-host rate-limit budget"
  - "SQL uses a separate exact-route policy while Insight continues to require one-shot manifest authorization"
provided_contracts:
  - "multidimensional report templates, metadata, aggregate query and total calculation"
  - "advertising account and report reads for 25 registered promotion platforms"
  - "business report, promoted object, attribution and material-library reads"
  - "Analysis event, funnel, retention, scatter and property aggregates with metadata-attested structured parameters"
  - "Analysis order, monetization, user, event timeline, postback and segment member atomic detail reads"
  - "Analysis segment-rule evaluation, user/event property value enumeration and account member directory reads"
  - "Analysis dashboard, default filters, saved-report and template catalog/detail/configuration reads"
  - "automatic pagination, partial batch results and upstream schema-drift detection"
  - "one executable material-report export workflow backed by a 22-route catalog: 8 online-verified, 7 partial, 7 uncalled"
entrypoints:
  - "gravity insight capabilities search <query>"
  - "gravity insight capabilities describe <operation-id>"
  - "gravity insight validate <operation-id> --input <request.json|-> --render-wire"
  - "gravity insight read <operation-id> --input <request.json|->"
  - "gravity insight batch read --input <batch.json|-> --concurrency 6"
  - "gravity insight export <start|status|wait|download|cancel|list>"
  - "gravity insight analysis segment --kind evaluate --input <request.json|->"
  - "gravity insight analysis detail --kind <order|order-split|monetization|user|user-event|postback-log> --input <request.json|->"
  - "gravity insight analysis users --input <request.json|-> --all-pages"
  - "gravity insight promotion snapshot --platform all --start YYYY-MM-DD --end YYYY-MM-DD"
readiness:
  - "independent from Gravity SQL evidence freshness"
  - "doctor validates local credentials, registry contracts and optional live connectivity"
  - "each operation exposes stability, callability, health, blockers and last-probe metadata"
  - "draft operations are discoverable but never callable; empty samples do not prove item schema"
  - "24 drafts currently have empty_sample as their only blocker after live pagination and fail-closed privacy checks; a controlled account with matching non-empty data is the required next input"
  - "context-dependent stable reads use runtime parent resolvers and report permission_unavailable when the current account has no matching parent row"
output_contracts:
  - "versioned JSON success/error envelopes with operation id, status, structured error, page, data and warnings"
  - "atomic output keeps source semantics after contract projection and mandatory redaction"
  - "batch failures are isolated per operation"
  - "governed export verifies host, path, MIME, archive safety, headers and SHA-256 before atomic file commit"
privacy_boundary:
  - "never print tokens, passwords, cookies or authorization headers"
  - "user_level operations may return explicitly contracted UID, ClientID, device, order, trace and segment-member fields"
  - "no arbitrary HTTP passthrough, caller-supplied download URL or uncontracted raw export"
  - "unknown upstream response fields remain hidden until their contract and privacy classification are reviewed"
stability_policy:
  - "stable operations are callable by default"
  - "stable does not override a suspect, upstream_changed or blocked health overlay"
  - "draft and experimental catalog entries remain non-callable until probe and privacy gates pass"
  - "blocked_write and blocked_privacy operations are never executable"
smoke_commands:
  - "gravity insight --dry-run"
