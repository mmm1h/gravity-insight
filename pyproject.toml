  "unavailable.py",
  "unavailable_analysis.py",
  "unavailable_promotion.py",
  "unavailable_report.py",
  "user_journey.py",
  "vocabulary.py",
]

[tool.ruff.lint]
select = ["F"]

[tool.pytest.ini_options]
addopts = "-n auto --dist load"
# Transient codex worktrees live at the repository root and duplicate every
# tests/ basename, which breaks pytest collection with import file mismatch.
norecursedirs = ["_wt_*", ".venv", "build", "dist", "tmp"]
