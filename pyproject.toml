[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gravity-insight"
version = "0.3.3"
description = "Agent-first governed data-analysis runtime, Python SDK, and CLI for Gravity"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "mmm1h"}]
maintainers = [{name = "mmm1h"}]
keywords = ["analytics", "cli", "governance", "gravity", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "requests==2.33.0",
  "sqlglot==30.17.0",
  "tzdata==2026.3",
]

[project.urls]
Repository = "https://github.com/mmm1h/gravity-insight"
Issues = "https://github.com/mmm1h/gravity-insight/issues"

[project.optional-dependencies]
control-plane = ["PyNaCl==1.6.0"]
dev = [
  "PyNaCl==1.6.0",
  "pytest>=9,<10",
  "pytest-xdist>=3.8,<4",
  "setuptools>=68",
  "wheel",
]

[project.scripts]
gravity = "gravity_insight.__main__:main"
gravity-insight = "gravity_insight.cli_stdio:insight_main"
gravity-sql = "gravity_insight.cli_stdio:sql_main"
gravity-mcp = "gravity_insight.mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["gravity_insight*"]

[tool.setuptools.package-data]
gravity_insight = [
  "contracts/**/*.json",
  "skills/**/*.md",
  "skills/**/*.json",
  "manifests/*.json",
  "census/data/*",
  "governance/*.json",
]

[tool.gravity_insight.agent-package-membership]
schema-version = 1
members = [
  "advertiser_profile.py",
  "analysis.py",
  "analysis_default_dictionary.py",
  "analysis_task.py",
