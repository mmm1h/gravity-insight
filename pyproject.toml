[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gravity-sdk"
version = "0.3.0"
description = "Governed Python SDK and CLI for Gravity Insight and custom SQL"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "<PYPI_PACKAGE_OWNER>"}]
maintainers = [{name = "<PYPI_MAINTAINER>"}]
keywords = ["analytics", "cli", "governance", "gravity", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "requests==2.32.5",
  "tzdata==2026.3",
]

[project.urls]
Repository = "https://github.com/<GITHUB_ORG>/<REPOSITORY>"
Issues = "https://github.com/<GITHUB_ORG>/<REPOSITORY>/issues"

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[project.scripts]
gravity = "gravity_sdk.__main__:main"
gravity-insight = "gravity_sdk.cli_stdio:insight_main"
gravity-sql = "gravity_sdk.cli_stdio:sql_main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["gravity_sdk*"]

[tool.setuptools.package-data]
gravity_sdk = [
  "contracts/**/*.json",
  "manifests/*.json",
  "census/data/*",
  "governance/*.json",
]

[tool.ruff.lint]
select = ["F"]
