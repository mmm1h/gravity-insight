schema_version = 1

[apps]
merge2-main = 29034827
merge2-secondary = 27192043
merge2-legacy = 24502679

[defaults]
app = "merge2-main"
timezone = "Asia/Shanghai"
time_window = "latest-safe-day"

[datasources.merge2]
id = "gravity_merge2_v1"
verification_status = "verified_with_gaps"
timezone = "Asia/Shanghai"
freshness = "latest safe calendar day"
privacy = "aggregate or schema-level output only"

[products.payment-summary]
kind = "payment-summary"
datasource = "merge2"
apps = ["merge2-main"]
forbidden_claims = [
  "会计净收入或财务对账",
  "活动归因、投放回收或 ROI",
  "assignment/holdout 不完整时的因果 uplift",
]
source_event = "$PayEvent"
window = "left-closed right-open in Asia/Shanghai"
amount = "properties.$pay_amount in cents"
order_key = "non-empty $order_id, otherwise user_id + create_time + $pay_reason + $pay_amount"
buyer = "distinct user_id"
limits = [
  "behavioral payment is not financial net revenue",
  "the product does not provide campaign attribution or causal uplift",
]

[products.first-scene-coverage]
kind = "first-scene-coverage"
datasource = "merge2"
apps = ["merge2-main", "merge2-secondary", "merge2-legacy"]
property = "$first_scene"
forbidden_claims = [
  "把用户属性 $first_scene 当作事件属性",
  "把空值或未知宿主解释为没有来源",
  "由场景覆盖率推导因果效果",
]
source = "user property $first_scene"
window = "left-closed right-open in Asia/Shanghai"
limits = [
  "$first_scene is not an event property",
  "empty or unknown values do not mean that the user had no source",
]

[products.first-scene-coverage.host_names]
"01" = "今日头条"
"02" = "抖音"
