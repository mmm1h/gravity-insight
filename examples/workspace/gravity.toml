[recipes.retention-weekly]
operation = "analysis.retention.query"
description = "Workspace-owned retention runbook example"
required_parameters = ["start", "end"]
output_fields = ["total", "x", "y"]
contract_fingerprint = "8b9b3a31284faa9e586342bb8875baba56f4e204a4e9c7115ab3939b8e9a2908"

[recipes.retention-weekly.bindings]
app_ref = "merge2-main"
app_input = "app_id"
report_ref = "workspace-retention"
report_input = "query_id"

[recipes.retention-weekly.parameters]
start = "date_list.0.start_date"
end = "date_list.0.end_date"

[recipes.retention-weekly.input]
query_item_list = [
  { event_name = "$AppStart", event_label = "$AppStart", custom_name = "$AppStart", target = { name = "PresetAllCount", field = "PresetAllCount" }, conditions = [], cond_logic = "AND", event_index = 0 },
  { event_name = "Login", event_label = "Login", custom_name = "Login", target = { name = "PresetAllCount", field = "PresetAllCount" }, conditions = [], cond_logic = "AND", event_index = 1 },
]
