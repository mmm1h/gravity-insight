schema_version = 1

[apps]
demo = 1001

[defaults]
app = "demo"
timezone = "Asia/Shanghai"
time_window = "latest-safe-day"

[datasources.demo]
id = "demo_warehouse"
verification_status = "pending_review"
timezone = "Asia/Shanghai"
privacy = "aggregate output only"

[products.daily-event-summary]
kind = "custom-sql"
datasource = "demo"
apps = ["demo"]
privacy = "aggregate"
output_fields = ["app_id", "event_name", "event_count"]
max_rows = 100
measurement = "daily aggregate event count"
forbidden_claims = [
  "user-level identity or behavior",
  "causal impact",
]
sql = """
SELECT
  app_id,
  event AS event_name,
  COUNT(*) AS event_count
FROM `default`.`event`
WHERE app_id IN ({app_ids})
  AND create_time >= CAST('{start}' AS DATETIME)
  AND create_time < CAST('{end}' AS DATETIME)
GROUP BY app_id, event
ORDER BY app_id, event_name
LIMIT {limit}
"""

[products.daily-event-summary.output_semantics]
app_id = "Gravity App identifier for this aggregate row"
event_name = "observed event name"
event_count = "event row count in the left-closed, right-open query window"

[semantic_context]
schema_version = "gravity.semantic-context.v1"
instructions = "Use only literal caller mappings and keep all request values explicit."

[[semantic_context.terms]]
name = "nebula-rollup"
phrases = ["nebula rollup", "orion overview"]
description = "Fictional caller-owned name for the registered overview product."
target = { kind = "product", ref = "composite:business_pulse" }

[[semantic_context.exclusions]]
name = "archived-nebula"
when = ["archived nebula"]
reason = "This fictional phrase is intentionally excluded from the overview mapping."
target = { kind = "product", ref = "composite:business_pulse" }

[[semantic_context.verified_queries]]
name = "orion-app-list"
question = "show the orion applications"
description = "Fictional caller-verified operation call."
operation = "app.list"
input = { page = 1, page_size = 20 }

[recipes.demo-retention]
operation = "analysis.retention.query"
description = "Fictional project-owned retention recipe"
required_parameters = ["start", "end"]
output_fields = ["total", "x", "y"]
contract_fingerprint = "8b9b3a31284faa9e586342bb8875baba56f4e204a4e9c7115ab3939b8e9a2908"

[recipes.demo-retention.bindings]
app_ref = "demo"
app_input = "app_id"
report_ref = "demo-retention"
report_input = "query_id"

[recipes.demo-retention.parameters]
start = "date_list.0.start_date"
end = "date_list.0.end_date"

[recipes.demo-retention.input]
query_item_list = [
  { event_name = "DemoStart", event_label = "DemoStart", custom_name = "DemoStart", target = { name = "PresetAllCount", field = "PresetAllCount" }, conditions = [], cond_logic = "AND", event_index = 0 },
  { event_name = "DemoReturn", event_label = "DemoReturn", custom_name = "DemoReturn", target = { name = "PresetAllCount", field = "PresetAllCount" }, conditions = [], cond_logic = "AND", event_index = 1 },
]

