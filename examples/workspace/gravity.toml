"29" = "抖音精选"
"99" = "IDE/特殊"

[products.energy-profile-coverage]
kind = "profile-coverage"
datasource = "merge2"
apps = ["merge2-main"]
activity_event = "AssetList"
measurement = "current cumulative/profile snapshot coverage"
forbidden_claims = [
  "把累计/当前快照解释为窗口新增体力产耗",
  "用 paid_assets 还原逐次体力消耗",
  "由字段覆盖率推导活动效果",
]
semantics = "coverage of cumulative or snapshot user properties"
limits = [
  "the product does not calculate energy consumed within the query window",
  "paid_assets cannot reconstruct per-action energy consumption",
]

[products.energy-profile-coverage.properties]
getpower = "total_getpower_num"
usepower = "total_usepower_num"
current_power = "current_power"

[products.event-coverage]
kind = "event-coverage"
datasource = "merge2"
apps = ["merge2-main"]
forbidden_claims = [
  "把单日未出现解释为埋点失效",
  "声称已完成全部字段级验证",
  "由事件存在性推导活动或版本效果",
]
source = "declared event names in this workspace"
semantics = "event presence within the query window"
limits = [
  "absence in one day does not prove instrumentation failure",
  "event presence does not prove campaign or version impact",
]
