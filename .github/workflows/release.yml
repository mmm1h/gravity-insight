name: SDK Release

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to recover or use for a read-only measurement
        required: true
        type: string
      measure:
        description: Run the release graph and read-only external tail without publishing
        required: false
        default: false
        type: boolean

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  release_windows_tests:
    name: release-windows-tests (${{ matrix.shard }}/4)
    if: github.event_name == 'push' || inputs.measure
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip
      - name: Install SDK and test runner
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Run complete Windows release test shard with duration budget
        run: >-
          python scripts/check_test_duration_budget.py
          --shard-index ${{ matrix.shard }}
          --shard-count 4
          --receipt tmp/pytest-shards/pytest-shard-${{ matrix.shard }}.json
      - name: Upload Windows release test shard receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-windows-pytest-shard-${{ matrix.shard }}
          path: tmp/pytest-shards/pytest-shard-${{ matrix.shard }}.json
          if-no-files-found: error

  release_windows_tests_audit:
    name: release-windows-tests-audit
    if: always() && (github.event_name == 'push' || inputs.measure)
    needs: release_windows_tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip
      - name: Install shard auditor
        run: python -m pip install --disable-pip-version-check pytest pytest-xdist
      - name: Download all Windows release test shard receipts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-windows-pytest-shard-*
          path: tmp/pytest-shards
          merge-multiple: true
      - name: Prove full Windows release collection and execution conservation
        run: >-
          python scripts/check_test_duration_budget.py
          --audit-receipts tmp/pytest-shards
          --expected-shards 4
          --audit-output tmp/pytest-shards/audit.json

  release_secret_history:
    name: release-secret-history
    if: github.event_name == 'push' || inputs.measure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip
      - name: Install SDK and secret scanner
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Scan tracked files and complete Git history for secrets
        run: python scripts/scan_repository_secrets.py --history --receipt release-evidence/secret-scan.json
      - name: Upload release secret-scan evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-secret-scan
          path: release-evidence/secret-scan.json
          if-no-files-found: error

  release_validation:
    name: release-validation
    if: github.event_name == 'push' || inputs.measure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip
      - name: Install SDK and test runner
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Check deterministic contracts
        run: python -m gravity_insight.compiler check
      - name: Check quality ratchet
        run: python -m gravity_insight.quality check
      - name: Check release tag matches package version
        if: github.event_name == 'push'
        run: python scripts/check_release_tag.py
      - name: Exercise release-tag gate without changing a remote tag
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git tag -d "$RELEASE_TAG" || true
          git tag "$RELEASE_TAG" HEAD
          python scripts/check_release_tag.py
      - name: Check development Agent usability eval
        env:
          PYTHONPATH: src
        run: |
          mkdir -p tmp
          python scripts/agent_usability_eval.py run --split development --output-dir tmp/agent-usability-gate > tmp/agent-usability-gate.log 2>&1 || {
            tail -n 40 tmp/agent-usability-gate.log
            exit 1
          }
          echo "PASS agent-usability development eval"
      - name: Check all CLI namespaces offline
        env:
          GRAVITY_INSIGHT_AUTO_UPGRADE: "0"
        run: |
          gravity --help
          gravity --workspace examples/workspace sql --dry-run
          gravity census --smoke
          gravity insight --dry-run

  release_supply_chain:
    name: release-supply-chain
    if: github.event_name == 'push' || inputs.measure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip
      - name: Install SDK and release tooling
        run: python -m pip install --disable-pip-version-check -e ".[dev]" twine
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check distributions
        run: python -m twine check dist/*
      - name: Generate wheel and sdist SBOMs
        run: python scripts/generate_release_sbom.py --dist-dir dist --output-dir release-evidence
      - name: Audit isolated wheel runtime dependencies
        run: python scripts/audit_release_dependencies.py --dist-dir dist --receipt release-evidence/dependency-audit.json
      - name: Upload checked distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
      - name: Upload release supply-chain evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-supply-chain
          path: release-evidence/
          if-no-files-found: error

  publish:
    name: publish
    if: github.event_name == 'push'
    needs:
      - release_windows_tests_audit
      - release_secret_history
      - release_validation
      - release_supply_chain
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Download checked distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-distributions
          path: dist/
      - name: Plan idempotent PyPI publish
        id: pypi-plan
        run: >-
          python scripts/verify_release_provenance.py pypi-plan
          --project gravity-insight
          --version "${GITHUB_REF_NAME#v}"
          --dist-dir dist
          --stage-dir "$RUNNER_TEMP/pypi-upload"
      - name: Publish missing distributions to PyPI
        if: steps.pypi-plan.outputs.upload_required == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          attestations: true
          packages-dir: ${{ runner.temp }}/pypi-upload/

  finalize_release:
    name: finalize-release
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Download release supply-chain evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-supply-chain
          path: release-evidence/
      - name: Download release secret-scan evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-secret-scan
          path: release-evidence/
      - name: Verify PyPI provenance binds to published files
        run: python scripts/verify_release_provenance.py gravity-insight "${GITHUB_REF_NAME#v}"
      - name: Reconcile GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/verify_release_provenance.py recover
          --project gravity-insight
          --version "${GITHUB_REF_NAME#v}"
          --tag "$GITHUB_REF_NAME"
          --repository "$GITHUB_REPOSITORY"
          --extra-asset-dir release-evidence

  measure_release:
    name: release-measurement
    if: inputs.measure
    needs:
      - release_windows_tests_audit
      - release_secret_history
      - release_validation
      - release_supply_chain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
          path: release-source
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Download existing release assets for a read-only publish plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p published-dist release-evidence
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.whl' --pattern '*.tar.gz' --dir published-dist
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.json' --dir release-evidence
      - name: Exercise idempotent PyPI publish plan without upload permission
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          python scripts/verify_release_provenance.py pypi-plan
          --project gravity-insight
          --version "${RELEASE_TAG#v}"
          --dist-dir published-dist
          --stage-dir "$RUNNER_TEMP/pypi-upload"
      - name: Verify existing PyPI provenance
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/verify_release_provenance.py gravity-insight "${RELEASE_TAG#v}"
      - name: Exercise idempotent GitHub reconciliation with a read-only token
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          python scripts/verify_release_provenance.py recover
          --project gravity-insight
          --version "${RELEASE_TAG#v}"
          --tag "$RELEASE_TAG"
          --repository "$GITHUB_REPOSITORY"
          --repository-root release-source
          --extra-asset-dir release-evidence

  recover_github_release:
    name: recover-github-release
    if: github.event_name == 'workflow_dispatch' && !inputs.measure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
          path: release-source
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Recover GitHub Release from published PyPI files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          python scripts/verify_release_provenance.py recover
          --project gravity-insight
          --version "${RELEASE_TAG#v}"
          --tag "$RELEASE_TAG"
          --repository "$GITHUB_REPOSITORY"
          --repository-root release-source
