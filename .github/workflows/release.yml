name: SDK Release

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install SDK and test runner
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Check deterministic contracts
        run: python -m gravity_sdk.compiler check
      - name: Check quality ratchet
        run: python -m gravity_sdk.quality check
      - name: Check release tag matches package version
        run: python scripts/check_release_tag.py
      - name: Check development Agent usability eval
        env:
          PYTHONPATH: src
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tmp | Out-Null
          python scripts/agent_usability_eval.py run --split development --output-dir tmp/agent-usability-gate > tmp/agent-usability-gate.log 2>&1
          if ($LASTEXITCODE -ne 0) {
            Get-Content tmp/agent-usability-gate.log -Tail 40
            exit $LASTEXITCODE
          }
          Write-Output "PASS agent-usability development eval"
      - name: Check all CLI namespaces offline
        shell: pwsh
        run: |
          gravity --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gravity --workspace examples/workspace sql --dry-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gravity census --smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gravity insight --dry-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install release tooling
        run: python -m pip install --disable-pip-version-check build twine
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check distributions
        run: python -m twine check dist/*
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem -LiteralPath dist -File |
            Select-Object -ExpandProperty FullName
          gh release create $env:GITHUB_REF_NAME @assets `
            --verify-tag --generate-notes --title $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Detect PyPI token
        id: pypi
        shell: pwsh
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PYPI_API_TOKEN)) {
            "configured=false" >> $env:GITHUB_OUTPUT
            Write-Output "PyPI token is not configured; upload will be skipped."
          } else {
            "configured=true" >> $env:GITHUB_OUTPUT
            Write-Output "PyPI token is configured."
          }
      - name: Publish distributions to PyPI
        if: steps.pypi.outputs.configured == 'true'
        shell: pwsh
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload --non-interactive dist/*
