name: SDK Release

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to recover or use for a read-only measurement
        required: true
        type: string
      measure:
        description: Run the release graph and read-only external tail without publishing
        required: false
        default: false
        type: boolean
      ci_run_id:
        description: Successful exact-SHA SDK CI run used by read-only measurement
        required: false
        type: string

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  verify_ci:
    name: verify-ci
    if: github.event_name == 'push' || inputs.measure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      ci_run_id: ${{ steps.ci.outputs.run_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip
      - name: Install release-tag checker
        run: python -m pip install --disable-pip-version-check -e .
      - name: Check release tag matches package version
        if: github.event_name == 'push'
        run: python scripts/check_release_tag.py
      - name: Require release tag to equal protected main
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          gh api "repos/$GITHUB_REPOSITORY/branches/main" \
            > "$RUNNER_TEMP/main-branch.json"
          python scripts/check_release_main.py \
            --expected-sha "$GITHUB_SHA" \
            --tag "$GITHUB_REF_NAME" \
            --main-ref refs/remotes/origin/main \
            --event-name "$GITHUB_EVENT_NAME" \
            --branch-metadata "$RUNNER_TEMP/main-branch.json" \
            --receipt release-evidence/main-equivalence.json
      - name: Exercise release-tag gate without changing a remote tag
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git tag -d "$RELEASE_TAG" || true
          git tag "$RELEASE_TAG" HEAD
          python scripts/check_release_tag.py
      - name: Require a green exact-SHA SDK CI run
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          MEASURE: ${{ inputs.measure }}
          REQUESTED_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          if [[ "$MEASURE" == "true" ]]; then
            run_id="$REQUESTED_RUN_ID"
            expected_event="workflow_dispatch"
            expected_branch="$GITHUB_REF_NAME"
          else
            run_id=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f head_sha="$GITHUB_SHA" -f branch=main -f event=push -f status=success -f per_page=100 \
              --jq '.workflow_runs | sort_by(.run_number) | .[-1].id // empty')
            expected_event="push"
            expected_branch="main"
          fi
          if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
            echo "No candidate SDK CI run for exact SHA $GITHUB_SHA" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/release-ci" release-evidence
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
            > "$RUNNER_TEMP/release-ci/run.json"
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs" \
            -f per_page=100 > "$RUNNER_TEMP/release-ci/jobs.json"
          python scripts/check_release_ci.py \
            --run "$RUNNER_TEMP/release-ci/run.json" \
            --jobs "$RUNNER_TEMP/release-ci/jobs.json" \
            --run-id "$run_id" \
            --expected-sha "$GITHUB_SHA" \
            --expected-event "$expected_event" \
            --expected-branch "$expected_branch" \
            --receipt release-evidence/ci.json
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download exact-SHA secret-scan receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ci-secret-scan
          path: release-evidence/
          github-token: ${{ github.token }}
          run-id: ${{ steps.ci.outputs.run_id }}
      - name: Validate complete-history secret-scan receipt binding
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("release-evidence/secret-scan.json")
          receipt = json.loads(path.read_text(encoding="utf-8"))
          expected = os.environ["EXPECTED_SHA"]
          valid = (
              receipt.get("status") == "passed"
              and receipt.get("history_included") is True
              and receipt.get("repository_head") == expected
              and receipt.get("history_commit_count", 0) > 0
              and receipt.get("scanned_tracked_file_count", 0) > 0
              and receipt.get("unreviewed_findings") == []
          )
          if not valid:
              raise SystemExit(f"invalid exact-SHA secret-scan receipt: {receipt}")
          print(f"PASS exact-SHA secret-scan receipt: sha={expected}")
          PY
      - name: Upload release secret-scan evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-secret-scan
          path: release-evidence/secret-scan.json
          if-no-files-found: error
      - name: Upload exact-SHA release CI evidence
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-ci-evidence
          path: |
            release-evidence/main-equivalence.json
            release-evidence/ci.json
          if-no-files-found: error

  release_supply_chain:
    name: release-supply-chain
    if: github.event_name == 'push' || inputs.measure
    needs: verify_ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip
      - name: Install SDK and release tooling
        run: python -m pip install --disable-pip-version-check -e ".[dev]" twine
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check distributions
        run: python -m twine check dist/*
      - name: Generate wheel and sdist SBOMs
        run: python scripts/generate_release_sbom.py --dist-dir dist --output-dir release-evidence
      - name: Audit isolated wheel runtime dependencies
        run: python scripts/audit_release_dependencies.py --dist-dir dist --receipt release-evidence/dependency-audit.json
      - name: Download exact-SHA release CI evidence
        if: github.event_name == 'push'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-ci-evidence
          path: tmp/release-input/
      - name: Download exact-SHA secret-history evidence
        if: github.event_name == 'push'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-secret-scan
          path: tmp/release-input/
      - name: Prepare exact-main Integrated Validation environment
        if: github.event_name == 'push'
        env:
          CONSUMER_REPO_DEPLOY_KEY: ${{ secrets.CONSUMER_REPO_DEPLOY_KEY }}
        run: |
          # The canonical consumer is a private repository, so an anonymous
          # clone fails with git's "could not read Username" before any gate
          # runs. GITHUB_TOKEN is scoped to this repository and cannot read it
          # either. The credential here is a read-only deploy key bound to that
          # one repository -- the narrowest thing that can satisfy the check.
          if [ -z "$CONSUMER_REPO_DEPLOY_KEY" ]; then
            echo "CONSUMER_REPO_DEPLOY_KEY is required to verify the canonical consumer" >&2
            exit 1
          fi
          install -d -m 700 "$RUNNER_TEMP/consumer-ssh"
          printf '%s\n' "$CONSUMER_REPO_DEPLOY_KEY" > "$RUNNER_TEMP/consumer-ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/consumer-ssh/id_ed25519"
          ssh-keyscan -t ed25519 github.com > "$RUNNER_TEMP/consumer-ssh/known_hosts" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/consumer-ssh/id_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/consumer-ssh/known_hosts"
          # Do NOT add --filter=blob:none here. This clone is not just read by
          # the gate -- check_installed_wheel_consumer.py runs `git fetch
          # <this path> <commit>` from a scratch repository, so the clone acts
          # as the *server* for that fetch. A blobless clone is a promisor
          # client with lazy fetching disabled on the serving side, so it
          # cannot hand over the blobs it deferred:
          #   remote: fatal: could not fetch <oid> from promisor remote
          #   fatal: protocol error: bad pack header
          # That is the whole failure of release run 33908804079 (29/30 gates
          # passed). Cloning the blobs up front is the cost of being fetchable.
          git clone --quiet --no-tags \
            git@github.com:mmm1h/work-dashboard.git "$RUNNER_TEMP/work-dashboard"
          consumer_head="$(git -C "$RUNNER_TEMP/work-dashboard" rev-parse --verify refs/heads/main)"
          # Prove the clone can be fetched *from* the way the gate does it,
          # here, rather than 20 minutes later inside gate 30 of 30. `cat-file
          # -e` would not do: a blobless clone still has every commit object,
          # so it passes in exactly the case this guards against. Only a real
          # fetch exercises the pack the serving side has to build.
          git init --quiet "$RUNNER_TEMP/consumer-fetch-probe"
          git -C "$RUNNER_TEMP/consumer-fetch-probe" \
            -c protocol.file.allow=always fetch --quiet --no-tags \
            "$RUNNER_TEMP/work-dashboard" "$consumer_head"
          rm -rf "$RUNNER_TEMP/consumer-fetch-probe"
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -e ".[dev]"
          git switch --force-create main "$GITHUB_SHA"
      - name: Run exact-tag Integrated Validation
        if: github.event_name == 'push'
        env:
          GRAVITY_CANONICAL_CONSUMER_REPOSITORY: ${{ runner.temp }}/work-dashboard
          GRAVITY_REQUIRE_CANONICAL_CONSUMER: "1"
          PYTEST_XDIST_AUTO_NUM_WORKERS: "4"
        run: >-
          .venv/bin/python scripts/run_integrated_validation.py
          --receipt release-evidence/integrated-validation.json
      - name: Check intended wheel surface matrix
        if: github.event_name == 'push'
        run: >-
          .venv/bin/python scripts/check_installed_wheel_surface_matrix.py
          --wheel dist/*.whl
          --receipt release-evidence/installed-wheel-surface.json
      - name: Check intended wheel canonical consumer
        if: github.event_name == 'push'
        run: >-
          .venv/bin/python scripts/check_installed_wheel_consumer.py
          --consumer-repository "$RUNNER_TEMP/work-dashboard"
          --revision 03d57598d601909da1297fcc0d9f31184d0f4da9
          --wheel dist/*.whl
          --strict-prerequisites
          --receipt release-evidence/canonical-consumer.json
      - name: Check release changelog and migration declaration
        if: github.event_name == 'push'
        run: >-
          .venv/bin/python scripts/check_changelog.py
          --release-version "${GITHUB_REF_NAME#v}"
          --receipt release-evidence/changelog.json
      - name: Aggregate pre-publish release receipt
        if: github.event_name == 'push'
        run: >-
          .venv/bin/python scripts/build_release_gate_receipt.py
          --expected-sha "$GITHUB_SHA"
          --release-tag "$GITHUB_REF_NAME"
          --dist-dir dist
          --sbom-dir release-evidence
          --main-receipt tmp/release-input/main-equivalence.json
          --ci-receipt tmp/release-input/ci.json
          --integrated-validation-receipt release-evidence/integrated-validation.json
          --secret-scan-receipt tmp/release-input/secret-scan.json
          --dependency-audit-receipt release-evidence/dependency-audit.json
          --surface-receipt release-evidence/installed-wheel-surface.json
          --consumer-receipt release-evidence/canonical-consumer.json
          --changelog-receipt release-evidence/changelog.json
          --output release-evidence/release-gate.json
      - name: Upload checked distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
      - name: Upload release supply-chain evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-supply-chain
          path: release-evidence/
          if-no-files-found: error

  publish:
    name: publish
    if: github.event_name == 'push'
    needs: [verify_ci, release_supply_chain]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Download checked distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-distributions
          path: dist/
      - name: Plan idempotent PyPI publish
        id: pypi-plan
        run: >-
          python scripts/verify_release_provenance.py pypi-plan
          --project gravity-insight
          --version "${GITHUB_REF_NAME#v}"
          --dist-dir dist
          --stage-dir "$RUNNER_TEMP/pypi-upload"
      - name: Publish missing distributions to PyPI
        if: steps.pypi-plan.outputs.upload_required == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          attestations: true
          packages-dir: ${{ runner.temp }}/pypi-upload/

  finalize_release:
    name: finalize-release
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Download release supply-chain evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-supply-chain
          path: release-evidence/
      - name: Download release secret-scan evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-secret-scan
          path: release-evidence/
      - name: Verify PyPI provenance binds to published files
        run: python scripts/verify_release_provenance.py gravity-insight "${GITHUB_REF_NAME#v}"
      - name: Reconcile GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/verify_release_provenance.py recover
          --project gravity-insight
          --version "${GITHUB_REF_NAME#v}"
          --tag "$GITHUB_REF_NAME"
          --repository "$GITHUB_REPOSITORY"
          --extra-asset-dir release-evidence

  measure_release:
    name: release-measurement
    if: inputs.measure
    needs: [verify_ci, release_supply_chain]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
          path: release-source
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Download existing release assets for a read-only publish plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p published-dist release-evidence
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.whl' --pattern '*.tar.gz' --dir published-dist
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.json' --dir release-evidence
      - name: Exercise idempotent PyPI publish plan without upload permission
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          python scripts/verify_release_provenance.py pypi-plan
          --project gravity-insight
          --version "${RELEASE_TAG#v}"
          --dist-dir published-dist
          --stage-dir "$RUNNER_TEMP/pypi-upload"
      - name: Verify existing PyPI provenance
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/verify_release_provenance.py gravity-insight "${RELEASE_TAG#v}"
      - name: Exercise idempotent GitHub reconciliation with a read-only token
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          python scripts/verify_release_provenance.py recover
          --project gravity-insight
          --version "${RELEASE_TAG#v}"
          --tag "$RELEASE_TAG"
          --repository "$GITHUB_REPOSITORY"
          --repository-root release-source
          --extra-asset-dir release-evidence

  recover_github_release:
    name: recover-github-release
    if: github.event_name == 'workflow_dispatch' && !inputs.measure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
          path: release-source
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Recover GitHub Release from published PyPI files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          python scripts/verify_release_provenance.py recover
          --project gravity-insight
          --version "${RELEASE_TAG#v}"
          --tag "$RELEASE_TAG"
          --repository "$GITHUB_REPOSITORY"
          --repository-root release-source
