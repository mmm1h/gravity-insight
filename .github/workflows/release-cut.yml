name: Release cut

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional version, must equal main's pyproject.toml version
        required: false
        type: string
      dry_run:
        description: Validate prep in CI and train locally without promoting or tagging
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-cut
  cancel-in-progress: false

jobs:
  cut:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 300
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      GRAVITY_INSIGHT_AUTO_SKILLS: "0"
      RELEASE_VERSION: ${{ inputs.version }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Require the release deploy key
        env:
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: test -n "$RELEASE_DEPLOY_KEY"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip
      - name: Install release tooling
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Cut or resume release
        run: |
          args=()
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          python scripts/release_cut.py run --version "$RELEASE_VERSION" "${args[@]}"
      - name: Remove dry-run ref even after failure
        if: always() && inputs.dry_run
        run: >-
          python scripts/release_cut.py cleanup
          --branch "release-cut/dry-run/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
