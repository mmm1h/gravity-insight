name: SDK CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  surface-parity:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip
      - name: Install SDK and test runner
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Check stable Direct and Plan surface parity
        run: python -m pytest -q tests/test_user_detail_aggregate.py

  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip
      - name: Install SDK and test runner
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Run tests with duration budget gate
        run: python scripts/check_test_duration_budget.py
      - name: Check deterministic contracts
        run: python -m gravity_insight.compiler check
      - name: Check quality ratchet
        run: python -m gravity_insight.quality check
      - name: Check release tag matches package version
        run: python scripts/check_release_tag.py
      - name: Check development Agent usability eval
        env:
          PYTHONPATH: src
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tmp | Out-Null
          python scripts/agent_usability_eval.py run --split development --output-dir tmp/agent-usability-gate > tmp/agent-usability-gate.log 2>&1
          if ($LASTEXITCODE -ne 0) {
            Get-Content tmp/agent-usability-gate.log -Tail 40
            exit $LASTEXITCODE
          }
          Write-Output "PASS agent-usability development eval"
      - name: Check all CLI namespaces offline
        env:
          GRAVITY_SDK_AUTO_UPGRADE: "0"
        shell: pwsh
        run: |
          gravity --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gravity --workspace examples/workspace sql --dry-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gravity census --smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gravity insight --dry-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  core-linux-python311:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip
      - name: Install SDK and test runner
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Run core tests
        run: python -m pytest -q
      - name: Check deterministic contracts
        run: python -m gravity_insight.compiler check
      - name: Check quality ratchet
        run: python -m gravity_insight.quality check

  core-linux-python312:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install SDK and test runner
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Import installed SDK
        run: python -c "import gravity_insight; print(gravity_insight.__version__)"
      - name: Run core tests
        run: python -m pytest -q

  installed-wheel-linux-python312:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install wheel gate dependencies without editable mode
        run: python -m pip install --disable-pip-version-check ".[dev]"
      - name: Build, install, and test an isolated wheel
        run: python scripts/check_installed_wheel_surface_matrix.py
