name: SDK CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install SDK and test runner
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Check deterministic contracts
        run: python -m gravity_sdk.compiler check
      - name: Check quality ratchet
        run: python -m gravity_sdk.quality check
      - name: Check development Agent usability eval
        env:
          PYTHONPATH: src
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tmp | Out-Null
          python scripts/agent_usability_eval.py run --split development --output-dir tmp/agent-usability-gate > tmp/agent-usability-gate.log 2>&1
          if ($LASTEXITCODE -ne 0) {
            Get-Content tmp/agent-usability-gate.log -Tail 40
            exit $LASTEXITCODE
          }
          Write-Output "PASS agent-usability development eval"
      - name: Check all CLI namespaces offline
        shell: pwsh
        run: |
          gravity --help
          gravity sql --dry-run
          gravity census --smoke
          gravity insight --dry-run
