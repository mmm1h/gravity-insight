name: Gravity upstream census

on:
  schedule:
    - cron: "17 * * * *"
    - cron: "47 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: gravity-upstream-census
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  inspect-public-static-graph:
    name: Inspect public static graph
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out the reviewed baseline
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the local package
        run: python -m pip install --disable-pip-version-check -e .

      - name: Check entry HTML only
        id: upstream
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP "gravity-drift"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $check = Join-Path $evidence "upstream-check.json"
          gravity census check-upstream --output $check
          $result = Get-Content -Raw $check | ConvertFrom-Json
          "changed=$($result.upstream_changed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          $dailyVerification = '${{ github.event.schedule }}' -eq '47 1 * * *'
          $manualVerification = '${{ github.event_name }}' -eq 'workflow_dispatch'
          $fullRequired = $result.upstream_changed -or $dailyVerification -or $manualVerification
          "full_required=$($fullRequired.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Fetch the complete public bundle graph
        id: fetch
        if: steps.upstream.outputs.full_required == 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP "gravity-drift"
          $raw = Join-Path $env:RUNNER_TEMP "gravity-census-raw"
          $snapshot = Join-Path $evidence "current-snapshot.json"
          $failure = Join-Path $evidence "fetch-failure.json"
          $stepResult = Join-Path $evidence "census-step-output.json"
          $attemptLimit = 3
          for ($attempt = 1; $attempt -le $attemptLimit; $attempt++) {
            if (Test-Path -LiteralPath $failure) {
              Remove-Item -LiteralPath $failure
            }
            $fallback = [ordered]@{
              schema_version = "gravity-census.step-output.v1"
              operation = "fetch_public_static_graph"
              status = "error"
              complete = $false
              drift_conclusion_available = $false
              failure_class = "unclassified"
              request_budget = [ordered]@{ used = 0; limit = 800; remaining = 800 }
              summary = [ordered]@{}
              failure = [ordered]@{
                schema_version = "gravity-census.failure.v1"
                status = "error"
                complete = $false
                drift_conclusion_available = $false
                code = "CENSUS_UNCLASSIFIED"
                category = "local"
                retryable = $false
                failure_class = "unclassified"
                classification = [ordered]@{
                  reason = "workflow_attempt_started_without_terminal_cli_output"
                  source_code = $null
                  source_status_class = $null
                  exception_type = $null
                }
                request_budget = [ordered]@{ used = 0; limit = 800; remaining = 800 }
                next_action = "Inspect the workflow process exit before deciding whether a retry is appropriate."
              }
              workflow_attempt = $attempt
            }
            $fallbackFailure = $fallback.failure
            $startedSnapshot = [ordered]@{
              schema_version = 1
              fetched_at = [DateTimeOffset]::UtcNow.ToString("yyyy-MM-ddTHH:mm:sszzz")
              site_url = "https://web.gravity-engine.com/"
              html = $null
              build_info = [ordered]@{}
              entry_urls = @()
              modulepreload_urls = @()
              ignored_nonmodule_scripts = @()
              manifest_probes = @()
              bundle_id = "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
              files = @()
              summary = [ordered]@{
                bundle_files = 0
                complete = $false
                completeness_reason = "workflow attempt started without terminal Census output"
                request_attempts = 0
                request_limit = 800
              }
              discovery = [ordered]@{ failures = @(); pending_urls = @() }
            }
            $fallback | ConvertTo-Json -Depth 10 | Set-Content -Encoding utf8 -LiteralPath $stepResult
            $fallbackFailure | ConvertTo-Json -Depth 10 | Set-Content -Encoding utf8 -LiteralPath $failure
            $startedSnapshot | ConvertTo-Json -Depth 10 | Set-Content -Encoding utf8 -LiteralPath $snapshot
            Write-Host "Complete crawl attempt $attempt of $attemptLimit"
            gravity census fetch --raw-dir $raw --output $snapshot --require-complete --max-attempts 1 --local-capacity-retries 2 --failure-output $failure --step-output $stepResult
            $fetchExit = $LASTEXITCODE
            try {
              $step = Get-Content -Raw -LiteralPath $stepResult | ConvertFrom-Json -ErrorAction Stop
              if ([string]$step.schema_version -ne "gravity-census.step-output.v1") {
                throw "unexpected Census step-output schema"
              }
            } catch {
              $step = $fallback | ConvertTo-Json -Depth 10 | ConvertFrom-Json
              $step.failure.classification.reason = "workflow_could_not_parse_cli_step_output"
              $step | ConvertTo-Json -Depth 10 | Set-Content -Encoding utf8 -LiteralPath $stepResult
            }
            if ($fetchExit -eq 0 -and $step.complete -eq $true) {
              "failure_class=none" >> $env:GITHUB_OUTPUT
              "crawl_attempts=$attempt" >> $env:GITHUB_OUTPUT
              "step_output=$stepResult" >> $env:GITHUB_OUTPUT
              exit 0
            }
            if ($fetchExit -eq 0) {
              $fetchExit = 4
              $step.failure_class = "unclassified"
              $step.failure.classification.reason = "cli_exit_zero_without_complete_step_output"
              $step | ConvertTo-Json -Depth 10 | Set-Content -Encoding utf8 -LiteralPath $stepResult
            }

            $failureClass = [string]$step.failure_class
            $cooldownMs = 30000
            if (Test-Path -LiteralPath $failure) {
              $diagnostic = Get-Content -Raw -LiteralPath $failure | ConvertFrom-Json
              if ($diagnostic.cooldown_remaining_ms -is [int64] -or $diagnostic.cooldown_remaining_ms -is [int32]) {
                $cooldownMs = [int64]$diagnostic.cooldown_remaining_ms
              }
            }
            if ($failureClass -ne "upstream_capacity") {
              "failure_class=$failureClass" >> $env:GITHUB_OUTPUT
              "crawl_attempts=$attempt" >> $env:GITHUB_OUTPUT
              "step_output=$stepResult" >> $env:GITHUB_OUTPUT
              exit $fetchExit
            }
            if ($attempt -lt $attemptLimit) {
              $reportedCooldown = [Math]::Ceiling($cooldownMs / 1000)
              $exponentialBackoff = 30 * [Math]::Pow(2, $attempt - 1)
              $delaySeconds = [Math]::Min(60, [Math]::Max($reportedCooldown, $exponentialBackoff))
              Write-Warning "Upstream capacity blocked the crawl; retrying after $delaySeconds seconds."
              Start-Sleep -Seconds $delaySeconds
            }
          }
          "failure_class=upstream_capacity" >> $env:GITHUB_OUTPUT
          "crawl_attempts=$attemptLimit" >> $env:GITHUB_OUTPUT
          "step_output=$stepResult" >> $env:GITHUB_OUTPUT
          exit 3

      - name: Parse routes and reconcile manifest coverage
        if: steps.upstream.outputs.full_required == 'true' && steps.fetch.outcome == 'success'
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP "gravity-drift"
          $raw = Join-Path $env:RUNNER_TEMP "gravity-census-raw"
          $routes = Join-Path $evidence "current-routes.json"
          gravity census parse --snapshot (Join-Path $evidence "current-snapshot.json") --raw-dir $raw --output $routes
          gravity census coverage --routes $routes --output (Join-Path $evidence "current-coverage.json") --report (Join-Path $evidence "current-coverage-report.md") --require-complete

      - name: Diff routes and locate affected operations
        id: impact
        if: steps.upstream.outputs.full_required == 'true' && steps.fetch.outcome == 'success'
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP "gravity-drift"
          $diff = Join-Path $evidence "route-diff.json"
          $impact = Join-Path $evidence "operation-impact.json"
          gravity census diff src/gravity_insight/census/data/routes.json (Join-Path $evidence "current-routes.json") --output $diff
          gravity census impact $diff --output $impact --overlay-output (Join-Path $evidence "health-overlay-candidate.json") --require-complete
          $plan = (Get-Content -Raw $impact | ConvertFrom-Json).probe_plan
          $plan | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 (Join-Path $evidence "targeted-probe-plan.json")

      - name: Build the actionable upstream drift signal
        id: drift_signal
        if: steps.upstream.outputs.full_required == 'true' && steps.fetch.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP "gravity-drift"
          $report = Join-Path $evidence "upstream-drift-signal.json"
          $summary = Join-Path $evidence "upstream-drift-signal.md"
          $issueBody = Join-Path $evidence "upstream-drift-issue.md"
          $plan = Join-Path $evidence "targeted-probe-plan.json"
          python scripts/build_upstream_drift_signal.py `
            --evidence-root evidence/probe `
            --probe-plan $plan `
            --require-probe-plan `
            --output $report `
            --summary-output $summary `
            --issue-body-output $issueBody `
            --run-url $env:RUN_URL
          $signalExit = $LASTEXITCODE
          if (Test-Path -LiteralPath $report) {
            $signal = Get-Content -Raw -LiteralPath $report | ConvertFrom-Json
            "status=$($signal.status)" >> $env:GITHUB_OUTPUT
            "fingerprint=$($signal.fingerprint)" >> $env:GITHUB_OUTPUT
          } else {
            "status=invalid" >> $env:GITHUB_OUTPUT
          }
          if (Test-Path -LiteralPath $summary) {
            Get-Content -LiteralPath $summary >> $env:GITHUB_STEP_SUMMARY
          }
          exit $signalExit

      - name: Verify current scoring evidence
        if: steps.upstream.outputs.full_required == 'true' && steps.fetch.outcome == 'success'
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP "gravity-drift"
          $statusPath = Join-Path $evidence "scoring-status.json"
          gravity census status --json `
            --evidence (Join-Path $evidence "census-step-output.json") `
            --evidence (Join-Path $evidence "current-snapshot.json") `
            --evidence (Join-Path $evidence "route-diff.json") |
            Set-Content -Encoding utf8 -LiteralPath $statusPath
          if ($LASTEXITCODE -ne 0) {
            throw "Census status could not read the scoring evidence."
          }
          $status = Get-Content -Raw -LiteralPath $statusPath | ConvertFrom-Json
          if ($status.current.measured -ne $true) {
            throw "The complete crawl did not produce current, baseline-bound scoring evidence."
          }
          if ([int64]$status.current.freshness.max_age_seconds -ne 93600) {
            throw "The Census current-evidence freshness contract drifted."
          }

      - name: Upload current scoring evidence
        if: steps.upstream.outputs.full_required == 'true' && steps.fetch.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gravity-census-current-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/gravity-drift/census-step-output.json
            ${{ runner.temp }}/gravity-drift/current-snapshot.json
            ${{ runner.temp }}/gravity-drift/route-diff.json
            ${{ runner.temp }}/gravity-drift/scoring-status.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload drift evidence, signal receipt, and targeted probe plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gravity-upstream-${{ github.run_id }}
          path: ${{ runner.temp }}/gravity-drift/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish the deduplicated upstream drift Issue
        if: always() && steps.drift_signal.outcome == 'success' && github.ref_name == github.event.repository.default_branch
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNAL_STATUS: ${{ steps.drift_signal.outputs.status }}
          SIGNAL_FINGERPRINT: ${{ steps.drift_signal.outputs.fingerprint }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if ($env:SIGNAL_STATUS -eq "inconclusive") {
            Write-Output "::warning title=Gravity upstream drift signal is inconclusive::No recognizable checked-in additive-response evidence was available. No managed Issue was created, updated, or closed; inspect $env:RUN_URL."
            exit 0
          }
          if ($env:SIGNAL_STATUS -notin @("action_required", "clear")) {
            throw "The drift signal has an unexpected status: $env:SIGNAL_STATUS"
          }

          $title = "[upstream drift] Action required"
          $marker = "<!-- gravity-upstream-drift-signal:v1"
          $search = '"[upstream drift] Action required" in:title'
          $issues = @(gh issue list --repo $env:GITHUB_REPOSITORY --state all --search $search --limit 100 --json number,title,state,body,labels | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) {
            throw "Could not query the managed upstream drift Issue."
          }
          $managed = @($issues | Where-Object { $_.title -eq $title -and [string]$_.body -like "$marker*" })
          if ($managed.Count -gt 1) {
            throw "Multiple managed upstream drift Issues exist; refusing an ambiguous update."
          }
          $issue = $managed | Select-Object -First 1

          function Set-ManagedStatus([object]$target, [string]$status) {
            $current = @($target.labels | ForEach-Object { $_.name } | Where-Object { $_ -like "status:*" })
            foreach ($label in $current) {
              gh issue edit $target.number --repo $env:GITHUB_REPOSITORY --remove-label $label | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "Could not remove managed Issue status $label." }
            }
            gh issue edit $target.number --repo $env:GITHUB_REPOSITORY --add-label $status | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Could not set managed Issue status $status." }
          }

          if ($env:SIGNAL_STATUS -eq "action_required") {
            $body = Join-Path $env:RUNNER_TEMP "gravity-drift/upstream-drift-issue.md"
            $fingerprintMarker = "$marker fingerprint=$env:SIGNAL_FINGERPRINT -->"
            if ($null -eq $issue) {
              $createArgs = @(
                "issue", "create", "--repo", $env:GITHUB_REPOSITORY,
                "--title", $title, "--body-file", $body,
                "--label", "bug,status:triage,priority:p2,area:contracts-census"
              )
              $ownerType = gh api "repos/$env:GITHUB_REPOSITORY" --jq ".owner.type"
              if ($LASTEXITCODE -ne 0) { throw "Could not inspect the repository owner type." }
              if ($ownerType -eq "User") {
                $createArgs += @("--assignee", $env:GITHUB_REPOSITORY_OWNER)
              }
              $created = & gh @createArgs
              if ($LASTEXITCODE -ne 0) { throw "Could not create the upstream drift Issue." }
              Write-Output "::warning title=Gravity upstream drift requires review::Created $created for actionable fingerprint $env:SIGNAL_FINGERPRINT."
            } elseif ($issue.state -eq "OPEN" -and [string]$issue.body -like "*$fingerprintMarker*") {
              Write-Host "Managed upstream drift Issue #$($issue.number) already has this fingerprint; no update was sent."
            } else {
              if ($issue.state -ne "OPEN") {
                gh issue reopen $issue.number --repo $env:GITHUB_REPOSITORY | Out-Null
                if ($LASTEXITCODE -ne 0) { throw "Could not reopen the upstream drift Issue." }
                Set-ManagedStatus $issue "status:triage"
              }
              gh issue comment $issue.number --repo $env:GITHUB_REPOSITORY --body "Actionable upstream drift changed to fingerprint ``$env:SIGNAL_FINGERPRINT``. Review $env:RUN_URL." | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "Could not notify subscribers about changed upstream drift." }
              gh issue edit $issue.number --repo $env:GITHUB_REPOSITORY --body-file $body | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "Could not update the upstream drift Issue body." }
              Write-Output "::warning title=Gravity upstream drift changed::Updated Issue #$($issue.number) for actionable fingerprint $env:SIGNAL_FINGERPRINT."
            }
          } elseif ($env:SIGNAL_STATUS -eq "clear" -and $null -ne $issue -and $issue.state -eq "OPEN") {
            Set-ManagedStatus $issue "status:released"
            gh issue close $issue.number --repo $env:GITHUB_REPOSITORY --reason completed --comment "A complete successful upstream census found no remaining actionable targeted probe or checked-in response drift. Verified by $env:RUN_URL." | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Could not close the cleared upstream drift Issue." }
          }

      - name: Reject an unavailable upstream drift signal
        if: steps.upstream.outputs.full_required == 'true' && steps.fetch.outcome == 'success' && steps.drift_signal.outcome != 'success'
        shell: pwsh
        run: throw "The complete census could not build a trustworthy drift signal. No Issue was created or closed; inspect the workflow logs and gravity-upstream artifact when available."

      - name: Warn when upstream capacity prevents a complete crawl
        if: steps.upstream.outputs.full_required == 'true' && steps.fetch.outcome != 'success' && steps.fetch.outputs.failure_class == 'upstream_capacity'
        shell: pwsh
        run: |
          $stepResult = Join-Path $env:RUNNER_TEMP "gravity-drift/census-step-output.json"
          $step = Get-Content -Raw -LiteralPath $stepResult | ConvertFrom-Json
          $classes = @($step.failure.failures | ForEach-Object { $_.status_class } | Sort-Object -Unique) -join ", "
          Write-Output "::warning title=Gravity upstream census capacity blocked::A required complete crawl remained blocked after ${{ steps.fetch.outputs.crawl_attempts }} attempts. Failure classes: $classes. No route-drift conclusion was made; inspect the uploaded fetch-failure.json before retrying."
          "### Gravity upstream census capacity warning" >> $env:GITHUB_STEP_SUMMARY
          "Upstream capacity prevented a required complete graph after ${{ steps.fetch.outputs.crawl_attempts }} bounded attempts. No route-drift conclusion was made. Inspect the uploaded fetch-failure.json before retrying." >> $env:GITHUB_STEP_SUMMARY

      - name: Reject an incomplete changed bundle crawl
        if: steps.upstream.outputs.full_required == 'true' && steps.fetch.outcome != 'success' && steps.fetch.outputs.failure_class != 'upstream_capacity'
        shell: pwsh
        run: throw "A required complete public static graph could not be proven for a non-capacity reason. Inspect the uploaded current-snapshot.json and fetch-failure.json, correct that cause, and rerun the workflow."
